<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Intervalos de Social Clip antes y después de quitar el hueco</title>
  <desc id="desc">Origen: escena A de 0 a 400 milisegundos, hueco de 200 y escena B de 600 a 1000. Salida: A de 0 a 400 y B de 400 a 800.</desc>
  <rect width="760" height="270" rx="6" fill="#f3f5f9"/>
  <g font-family="Arial, sans-serif" fill="#1c2236">
    <text x="28" y="33" font-size="18" font-weight="bold">Mismas escenas, sin el intervalo vacío</text>
    <text x="28" y="82" font-size="15">Origen</text>
    <text x="28" y="190" font-size="15">Salida</text>
    <rect x="130" y="55" width="232" height="42" rx="4" fill="#4338ca"/>
    <rect x="362" y="55" width="116" height="42" fill="#e2e5ed"/>
    <rect x="478" y="55" width="232" height="42" rx="4" fill="#006b60"/>
    <rect x="130" y="163" width="232" height="42" rx="4" fill="#4338ca"/>
    <rect x="362" y="163" width="232" height="42" rx="4" fill="#006b60"/>
    <g fill="white" font-size="16" text-anchor="middle">
      <text x="246" y="82">Escena A</text><text x="594" y="82">Escena B</text>
      <text x="246" y="190">Escena A</text><text x="478" y="190">Escena B</text>
    </g>
    <text x="420" y="81" font-size="14" text-anchor="middle">Hueco</text>
    <g font-size="13" text-anchor="middle">
      <text x="130" y="117">0</text><text x="362" y="117">400</text><text x="478" y="117">600</text><text x="710" y="117">1000 ms</text>
      <text x="130" y="226">0</text><text x="362" y="226">400</text><text x="594" y="226">800 ms</text>
    </g>
    <path d="M478 124 L374 153" fill="none" stroke="#006b60" stroke-width="2"/>
    <path d="m380 145 -6 8 11 0" fill="none" stroke="#006b60" stroke-width="2"/>
  </g>
</svg>
